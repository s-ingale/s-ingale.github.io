---
layout: default
---
<main id="main" class="home">
  <canvas class="petal-canvas" data-petal-physics aria-hidden="true"></canvas>
  {% assign entries = site.journal | sort: 'date' | reverse %}
  {% if entries.size > 0 %}
  <section class="journal" aria-label="Journal">
    {% for post in entries %}{% include card.html post=post %}{% endfor %}
  </section>
  {% endif %}
  <script src="{{ '/assets/js/petals.js' | relative_url }}?v=petal-physics-2" defer></script>
</main>
