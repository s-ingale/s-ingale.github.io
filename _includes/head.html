<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.title | strip_html | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.title | strip_html | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  try {
    if (localStorage.getItem('journal-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/cherry-blossom.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=petal-physics-1">
