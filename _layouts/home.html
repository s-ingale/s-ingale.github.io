---
layout: default
---
<main class="home">
  <header class="masthead">
    <div class="masthead__photo">
      <img src="{{ '/assets/img/profile.png' | relative_url }}" alt="{{ site.author.name }}">
    </div>
    <div class="masthead__intro">
      <p class="site-intro">{{ site.intro }}</p>
    </div>
  </header>

  {% assign posts = site.tech | concat: site.philosophy | sort: "date" | reverse %}
  <section class="grid" id="grid">
    {% for post in posts %}
      {% include card.html post=post %}
    {% endfor %}
  </section>

  {% if posts.size == 0 %}
    <p class="empty">No posts yet — add a <code>.md</code> file to <code>_tech/</code> or <code>_philosophy/</code>.</p>
  {% endif %}
</main>
